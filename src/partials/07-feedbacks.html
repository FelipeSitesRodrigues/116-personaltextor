<section class="feedbacks secao cv" id="feedbacks" aria-labelledby="feedbacks-titulo" style="--cvh:2200px">
  <div class="caixa">
    <div class="faixa" data-revela><span class="faixa__ponto">Feedbacks</span><span class="faixa__fim">Quem está no processo</span></div>
    <h2 class="titulo feedbacks__titulo" id="feedbacks-titulo" data-palavras data-revela="palavras">Quem está no processo conta melhor.</h2>
  </div>

  <div class="feedbacks__palco">
    <div class="parede parede--esq" aria-hidden="true"><!-- @gerar parede-esq --></div>
    <div class="parede parede--dir" aria-hidden="true"><!-- @gerar parede-dir --></div>

    <div class="depo vidro" data-revela="zoom" data-depo aria-roledescription="carrossel" aria-label="Depoimentos de alunos">
      <svg class="depo__aspas" viewBox="0 0 64 48" aria-hidden="true"><path d="M0 48V28C0 12 9 3 26 0l3 7C19 10 14 16 14 24h12v24H0Zm35 0V28c0-16 9-25 26-28l3 7c-10 3-15 9-15 17h12v24H35Z"/></svg>
      <div class="depo__lista" aria-live="polite"><!-- @gerar depoimentos --></div>
      <div class="depo__nav">
        <button type="button" class="redondo" data-depo-ant aria-label="Depoimento anterior"><i data-i="arrow-left" data-w="bold"></i></button>
        <button type="button" class="redondo" data-depo-prox aria-label="Próximo depoimento"><i data-i="arrow-right" data-w="bold"></i></button>
        <span class="depo__conta"><span data-depo-atual>01</span> / <!-- @gerar dep-total --></span>
      </div>
      <span class="depo__barra" aria-hidden="true"><span data-depo-barra></span></span>
    </div>
  </div>

  <div class="caixa prints">
    <p class="prints__rotulo" data-revela><span>Prints reais</span> direto do WhatsApp dos alunos</p>
    <ul class="prints__mural">
      <li class="print" data-revela="grade" style="--i:0"><figure><img data-img="print-constancia" sizes="(max-width: 47.99em) 46vw, 340px" alt="Print de conversa no WhatsApp. Aluno: &quot;Após iniciarmos os trabalhos minha constância nos treinos mudou completamente. Mês passado 26 treinos, nesse mês 16 até agora.&quot; Ricardo responde: &quot;Orientação, organização e disciplina gerando resultados. Parabéns pela dedicação!&quot;" loading="lazy" draggable="false"><figcaption>Constância: 26 treinos no mês</figcaption></figure></li>
      <li class="print" data-revela="grade" style="--i:1"><figure><img data-img="print-cotovelos" sizes="(max-width: 47.99em) 46vw, 340px" alt="Print de conversa no WhatsApp. O aluno manda vídeos do exercício e o Ricardo orienta: &quot;Projete os cotovelos levemente à frente, pode descer mais o movimento.&quot; No vídeo seguinte: &quot;Boa, cotovelos estão mais à frente.&quot;" loading="lazy" draggable="false"><figcaption>Correção por vídeo, série a série</figcaption></figure></li>
      <li class="print" data-revela="grade" style="--i:2"><figure><img data-img="print-peso" sizes="(max-width: 47.99em) 46vw, 340px" alt="Print de conversa no WhatsApp. Aluno: &quot;Fiquei de cara, Ricardo! Depois dos ajustes da reunião do mês passado, com as dicas da alimentação e cardio, a diferença foi muito grande. Eu tava pesando 84,200 no mês passado, no último domingo deu 80,700. Emagreci 3kg e continuo ganhando massa muscular.&quot;" loading="lazy" draggable="false"><figcaption>3,5 kg a menos em um mês</figcaption></figure></li>
      <li class="print" data-revela="grade" style="--i:0"><figure><img data-img="print-bulgaro" sizes="(max-width: 47.99em) 46vw, 340px" alt="Print de conversa no WhatsApp. Aluno pergunta se há vídeo explicando o posicionamento do búlgaro; o Ricardo manda a aula em vídeo e pede: &quot;Tudo aí explicado, mas filma a execução pra eu te orientar.&quot;" loading="lazy" draggable="false"><figcaption>Aula do exercício na hora</figcaption></figure></li>
      <li class="print" data-revela="grade" style="--i:1"><figure><img data-img="print-coluna" sizes="(max-width: 47.99em) 46vw, 340px" alt="Print de conversa no WhatsApp. Aluno: &quot;Não tô conseguindo manter essa coluna reta&quot;, com o vídeo da execução e a resposta do Ricardo em vídeo." loading="lazy" draggable="false"><figcaption>Dúvida de execução com vídeo</figcaption></figure></li>
      <li class="print" data-revela="grade" style="--i:2"><figure><img data-img="print-audio" sizes="(max-width: 47.99em) 46vw, 340px" alt="Print de conversa no WhatsApp com áudios do Ricardo respondendo as dúvidas do aluno, que responde &quot;Pronto&quot;, &quot;Entendi&quot;, &quot;Perfeito&quot;." loading="lazy" draggable="false"><figcaption>Resposta em áudio no mesmo dia</figcaption></figure></li>
    </ul>
  </div>

  <div class="caixa feedbacks__fim" data-revela>
    <a class="botao botao--cobre" href="#aplicar" data-brilho><span class="brilho" aria-hidden="true"><span class="brilho__volta"><span class="brilho__ponto"></span></span></span><span class="brilho-fio" aria-hidden="true"><span class="brilho__ponto"></span></span>Quero minha vaga<i data-i="arrow-right" data-w="bold" class="i--seta"></i></a>
  </div>
</section>
